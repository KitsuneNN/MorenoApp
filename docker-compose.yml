services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morenoapp
      POSTGRES_USER: moreno
      POSTGRES_PASSWORD: moreno_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moreno -d morenoapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://moreno:moreno_dev_password@postgres:5432/morenoapp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
